syntax = "proto3";

package muxcore.inputvalidate.v1;

option go_package = "github.com/Muxcore-Media/input-validate-jsonschema/muxcore/inputvalidate/v1;inputvalidatev1";

service InputValidateService {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc SupportedSchemas(SupportedSchemasRequest) returns (SupportedSchemasResponse);
}

message ValidateRequest {
  string schema = 1;
  bytes data = 2;
}

message ValidateResponse {
  bool valid = 1;
  repeated string errors = 2;
  bytes sanitized = 3;
}

message SupportedSchemasRequest {}

message SupportedSchemasResponse {
  repeated string schemas = 1;
}
